<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form & Validation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .form-container {
      background: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(27, 27, 48, 0.842);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      margin-bottom: 20px;
      color: #190c8e;
      text-align: center;
    }
    .field {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
    }
    label {
      font-weight: bold;
      margin-bottom: 5px;
      color: #061a8d;
    }
    input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }
    input:focus {
      border-color: #0f6b63;
      outline: none;
    }
    .error-msg {
      color: #c0392b;
      font-size: 12px;
      margin-top: 5px;
      min-height: 15px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #0f176b;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: lch(8.74% 46.2 301.72);
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Register</h2>
    <form id="registrationForm" novalidate>
      
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter your name">
        <span class="error-msg" id="nameError"></span>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email">
        <span class="error-msg" id="emailError"></span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 8 characters">
        <span class="error-msg" id="passwordError"></span>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter your password">
        <span class="error-msg" id="confirmPasswordError"></span>
      </div>

      <div class="field">
        <label for="age">Age</label>
        <input type="number" id="age" placeholder="Enter your age">
        <span class="error-msg" id="ageError"></span>
      </div>

      <button type="submit">Submit</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('registrationForm');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const ageInput = document.getElementById('age');

    const nameError = document.getElementById('nameError');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');
    const confirmPasswordError = document.getElementById('confirmPasswordError');
    const ageError = document.getElementById('ageError');

    form.addEventListener('submit', function(event) {
      let isValid = true;

      // Reset error messages
      nameError.textContent = '';
      emailError.textContent = '';
      passwordError.textContent = '';
      confirmPasswordError.textContent = '';
      ageError.textContent = '';

      // 1. Check Name
      if (nameInput.value.trim() === '') {
        nameError.textContent = 'Name is required.';
        isValid = false;
      }

      // 2. Check Email
      const emailValue = emailInput.value.trim();
      if (emailValue === '') {
        emailError.textContent = 'Email is required.';
        isValid = false;
      } else if (!emailValue.includes('@') || !emailValue.includes('.')) {
        emailError.textContent = 'Please enter a valid email address.';
        isValid = false;
      }

      // 3. Check Password (at least 8 characters)
      if (passwordInput.value.length < 8) {
        passwordError.textContent = 'Password must be at least 8 characters.';
        isValid = false;
      }

      // 4. Check Confirm Password
      if (confirmPasswordInput.value !== passwordInput.value || confirmPasswordInput.value === '') {
        confirmPasswordError.textContent = 'Passwords do not match.';
        isValid = false;
      }

      // 5. Check Age
      const ageValue = Number(ageInput.value);
      if (ageInput.value.trim() === '' || isNaN(ageValue) || ageValue <= 0) {
        ageError.textContent = 'Please enter a valid age.';
        isValid = false;
      }

      // If any validation failed, stop the form from being submitted
      if (!isValid) {
        event.preventDefault();
      }
    });
  </script>

</body>
</html>
