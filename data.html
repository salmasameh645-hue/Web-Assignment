<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Table - Studio</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .data-container {
      max-width: 800px;
      margin: 40px auto;
      background: var(--surface);
      padding: 30px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }
    .controls {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .controls input[type="text"] {
      padding: 10px 14px;
      width: 60%;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }
    .sort-btns {
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <a class="logo" href="index.html">Studio</a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="components.html">Components</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="data.html" class="active">Data</a></li>
        <li><a href="validation.html">Validation</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <div class="data-container">
      <h2>Data Table with Search & Sort</h2>
      
      <div class="controls">
        <input type="text" id="searchInput" placeholder="Search by name or city...">
        <div class="sort-btns">
          <button id="sortNameBtn" class="btn">Sort by Name</button>
          <button id="sortAgeBtn" class="btn">Sort by Age</button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Age</th>
              <th>City</th>
            </tr>
          </thead>
          <tbody id="tableBody">
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <footer class="site-footer" style="margin-top: 48px;">
    <div class="container">&copy; 2026 Teal UI System. All rights reserved.</div>
  </footer>

  <script>
    const people = [
      { name: "Salma Sameh", age: 20, city: "Cairo" },
      { name: "Omar Ahmed", age: 22, city: "Alexandria" },
      { name: "Habiba Mahmoud", age: 21, city: "Giza" },
      { name: "Ali Hamed", age: 23, city: "Mansoura" },
      { name: "Karim Tarek", age: 19, city: "Aswan" },
      { name: "Nourhan Ezzat", age: 24, city: "Luxor" },
    ];

    const tableBody = document.getElementById('tableBody');
    const searchInput = document.getElementById('searchInput');
    const sortNameBtn = document.getElementById('sortNameBtn');
    const sortAgeBtn = document.getElementById('sortAgeBtn');

    function displayTable(dataArray) {
      tableBody.innerHTML = '';
      dataArray.forEach(person => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${person.name}</td>
          <td>${person.age}</td>
          <td>${person.city}</td>
        `;
        tableBody.appendChild(row);
      });
    }

    displayTable(people);

    searchInput.addEventListener('input', function() {
      const searchTerm = searchInput.value.toLowerCase();
      const filteredData = people.filter(person => 
        person.name.toLowerCase().includes(searchTerm) || 
        person.city.toLowerCase().includes(searchTerm)
      );
      displayTable(filteredData);
    });

    sortNameBtn.addEventListener('click', function() {
      const sortedData = [...people].sort((a, b) => a.name.localeCompare(b.name));
      displayTable(sortedData);
    });

    sortAgeBtn.addEventListener('click', function() {
      const sortedData = [...people].sort((a, b) => a.age - b.age);
      displayTable(sortedData);
    });
  </script>
</body>
</html>
