<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Table with Search & Sort</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 40px;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    h2 {
      margin-bottom: 20px;
      color: #ac0303;
      text-align: center;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 10px;
      flex-wrap: wrap;
    }
    input[type="text"] {
      padding: 10px;
      width: 60%;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }
    .sort-btns {
      display: flex;
      gap: 10px;
    }
    button {
      padding: 10px 15px;
      background-color: hsla(0, 75%, 24%, 0.877);
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: hwb(0 4% 69%);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: hsl(0, 75%, 24%);
      color: white;
    }
    tr:hover {
      background-color: #f1f1f1;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Data Table</h2>
    
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search by name or city...">
      <div class="sort-btns">
        <button id="sortNameBtn">Sort by Name</button>
        <button id="sortAgeBtn">Sort by Age</button>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Age</th>
          <th>City</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <!-- Data will be populated by JavaScript -->
      </tbody>
    </table>
  </div>

  <script>
    // Array of objects (Persons / Data)
    const people = [
      { name: "Salma Sameh", age: 20, city: "Cairo" },
      { name: "Omar Ahmed", age: 22, city: "Alexandria" },
      { name: "Habiba Mahmoud", age: 21, city: "Giza" },
      { name: "Ali Hamed", age: 23, city: "Mansoura" },
      { name: "Karim Tarek", age: 19, city: "Aswan" }
    ];

    const tableBody = document.getElementById('tableBody');
    const searchInput = document.getElementById('searchInput');
    const sortNameBtn = document.getElementById('sortNameBtn');
    const sortAgeBtn = document.getElementById('sortAgeBtn');

    // Function to display data in the table
    function displayTable(dataArray) {
      tableBody.innerHTML = '';
      dataArray.forEach(person => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${person.name}</td>
          <td>${person.age}</td>
          <td>${person.city}</td>
        `;
        tableBody.appendChild(row);
      });
    }

    // Initial display
    displayTable(people);

    // Search functionality (Filters while typing instantly)
    searchInput.addEventListener('input', function() {
      const searchTerm = searchInput.value.toLowerCase();
      const filteredData = people.filter(person => 
        person.name.toLowerCase().includes(searchTerm) || 
        person.city.toLowerCase().includes(searchTerm)
      );
      displayTable(filteredData);
    });

    // Sort by Name
    sortNameBtn.addEventListener('click', function() {
      const sortedData = [...people].sort((a, b) => a.name.localeCompare(b.name));
      displayTable(sortedData);
    });

    // Sort by Age
    sortAgeBtn.addEventListener('click', function() {
      const sortedData = [...people].sort((a, b) => a.age - b.age);
      displayTable(sortedData);
    });
  </script>

</body>
</html>
